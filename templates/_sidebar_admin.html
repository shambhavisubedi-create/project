<aside class="sidebar" id="sidebar">

    <a href="{{ url_for('manage_travellers') }}" class="{{ 'active' if request.endpoint == 'manage_travellers' else '' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><circle cx="18" cy="9" r="2.4"/><path d="M16.2 14.2c2.6.3 4.8 2.3 4.8 5.3"/></svg>

    <a href="{{ url_for('admin_packages') }}" class="{{ 'active' if request.endpoint == 'admin_packages' else '' }}">

      <span class="label">Packages</span>
    </a>
    <a href="{{ url_for('admin_bookings') }}" class="{{ 'active' if request.endpoint == 'admin_bookings' else '' }}">

      <span class="label">Bookings</span>
    </a>
    <a href="{{ url_for('admin_refunds') }}" class="{{ 'active' if request.endpoint == 'admin_refunds' else '' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18"/><path d="M7 15h4"/><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M16 3v4M8 3v4"/></svg>

    </a>
    <a href="{{ url_for('admin_activity') }}" class="{{ 'active' if request.endpoint == 'admin_activity' else '' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      <span class="label">Logout</span>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
