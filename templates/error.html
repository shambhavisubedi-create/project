<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ status_code }} - GoGather</title>
<style>
  :root { --primary: #a9455c; --primary-dark: #8a3549; --charcoal: #2c2420; --text: #4a3d38; --muted: #8a7b73; --bg: #fdf3ea; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .box { max-width: 460px; text-align: center; }
  .code { font: 700 5rem/1 Georgia, serif; color: var(--primary); margin: 0; }
  h1 { font: 700 1.6rem Georgia, serif; color: var(--charcoal); margin: 10px 0; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
  a.btn { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: 700; }
  a.btn:hover { background: var(--primary-dark); }
</style>
{% include "_ui_head.html" %}
</head>
<body>
  <main class="box">
    <p class="code">{{ status_code }}</p>
    <h1>{{ title }}</h1>
    <p>{{ detail }}</p>
    <a class="btn" href="{{ home_url }}">Back to GoGather</a>
  </main>
</body>
</html>
