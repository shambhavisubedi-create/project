<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoGather - Login Page</title>
<style>
  :root {
    --primary: #a9455c;
    --primary-dark: #8a3549;
    --primary-light: #fbe4e6;
    --charcoal: #2c2420;
    --text: #4a3d38;
    --text-muted: #8a7b73;
    --border: #f0e3d5;
    --bg: #fdf3ea;
    --cream-deep: #fbe7e3;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  h1 { font-family: var(--font-display); color: var(--charcoal); margin: 0 0 8px; }
  a { color: var(--primary-dark); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .navbar { background: var(--bg); border-bottom: 1px solid var(--border); }
  .navbar-inner { max-width: 1200px; margin: 0 auto; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; color: var(--charcoal); }
  .nav-links a { color: var(--text); font-weight: 600; font-size: 0.92rem; padding: 8px 16px; border-radius: 999px; margin-left: 4px; }
  .nav-cta { background: var(--primary); color: #fff !important; padding: 9px 22px; border-radius: 999px; font-weight: 700; }

  /* split screen: illustration left, form right */
  .auth-split { display: flex; min-height: calc(100vh - 68px); flex-wrap: wrap; }

  .illustration-panel {
    flex: 1 1 45%;
    background: linear-gradient(160deg, var(--cream-deep) 0%, var(--primary-light) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .illustration-panel img { max-width: 380px; width: 100%; height: auto; }
  .illustration-caption { margin-top: 22px; text-align: center; color: var(--charcoal); font-family: var(--font-display); font-size: 1.15rem; max-width: 340px; }
  .illustration-caption span { display: block; font-family: -apple-system, sans-serif; font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; font-weight: 400; }

  .form-panel { flex: 1 1 55%; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .form-card { width: 100%; max-width: 400px; }
  .form-card p.subtitle { color: var(--text-muted); margin-bottom: 26px; }

  .form-group { margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: 0.87rem; margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.92rem;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

  .btn {
    display: inline-block;
    width: 100%;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--primary-dark); }

  hr.sep { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .error-box { background: #fbe7e3; border: 1px solid #e6b6ab; color: #8a3549; padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; }

  @media (max-width: 860px) {
    .illustration-panel { padding: 32px 24px 24px; }
    .illustration-panel img { max-width: 220px; }
  }
</style>
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="/">GoGather</a>
      <nav class="nav-links">
        <a href="/">Welcome</a>
        <a href="/login">Sign in</a>
        <a class="nav-cta" href="/register">Plan a trip</a>
      </nav>
    </div>
  </header>

  <div class="auth-split">
    <div class="illustration-panel">
      <img src="/static/pict1.jpg" alt="Illustration of the Himalayas with a pagoda and prayer flags">
      <p class="illustration-caption">
        Namaste, traveller.
        <span>Sign in to pick up your itinerary, your groups, and your bookings.</span>
      </p>
    </div>

    <div class="form-panel">
      <div class="form-card">
        <h1>Sign in to GoGather</h1>
        <p class="subtitle">Enter your username and password to continue.</p>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
          <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" placeholder="Enter your username or email" autocomplete="username" required autofocus>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>
          <button type="submit" class="btn">Login</button>
        </form>

        <hr class="sep">
        <p class="subtitle">New traveller? <a href="/register">Register an account</a></p>
      </div>
    </div>
  </div>

</body>
</html>
